# Project-level: Sol leads, Luna executes.
# This checked-in template is the official ChatGPT-login mode: it deliberately
# has no model_provider or gateway block. For a custom OpenAI-compatible
# endpoint, copy config.custom-gateway.toml.example over this file and set only
# the documented environment variable; never put a key in this file.
# If spawn_agent rejects gpt-5.6-luna, run:
#   bash scripts/prepare-luna-catalog.sh "$(pwd)/.codex/models-v1.json"
# then set model_catalog_json to that absolute path and multi_agent_v2=false.

model = "gpt-5.6-sol"
model_reasoning_effort = "low"
service_tier = "default"

[features]
multi_agent = true
multi_agent_v2 = false

[agents]
max_concurrent_threads_per_session = 4
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "low"
